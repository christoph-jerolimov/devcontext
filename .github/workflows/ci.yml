name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the minimum devcontext supports (node:sqlite), 24 is current.
        node: ['22', '24']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (oxfmt)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The site renders docs/, so a renamed page or a broken cross reference
  # breaks it — which is only visible once it is built.
  site:
    name: Site
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build:site

      - name: Check the rendered links
        run: npm run check:links --workspace @devcontext/site

  # Syncs this repository from the real GitHub API. Kept separate so a GitHub
  # outage or a rate limit cannot make the offline checks look broken.
  e2e:
    name: End to end sync
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync issues and pull requests of this repository
        env:
          DEVCONTEXT_E2E_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVCONTEXT_E2E_REPO: ${{ github.repository }}
        run: npm run test:e2e
