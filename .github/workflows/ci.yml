name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the minimum devcontext supports (node:sqlite), 24 is current.
        node: ['22', '24']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (oxfmt)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint

      # Before the type check: @devcontext/eve imports @devcontext/cli, whose
      # type declarations only exist once the CLI is built.
      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  # The site renders docs/, so a renamed page or a broken cross reference
  # breaks it — which is only visible once it is built.
  site:
    name: Site
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build:site

      - name: Check the rendered links
        run: npm run check:links --workspace @devcontext/site

      - name: Check both syntax themes are wired up
        run: npm run check:themes --workspace @devcontext/site

  # Syncs this repository from the real GitHub API. Kept separate so a GitHub
  # outage or a rate limit cannot make the offline checks look broken.
  e2e:
    name: End to end sync
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync issues and pull requests of this repository
        env:
          DEVCONTEXT_E2E_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVCONTEXT_E2E_REPO: ${{ github.repository }}
        run: npm run test:e2e

  # Syncs a fixture API, serves what it wrote, and drives the result in a real
  # browser. Offline and deterministic, so unlike the job above it can fail
  # only because something is actually broken.
  viewer:
    name: End to end viewer
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The screenshots are compared here, deliberately.
      #
      # This step used to pass `--ignore-snapshots`, on the theory that a
      # baseline recorded on a developer's machine could not survive a
      # different Chromium build and a different set of fonts. The flag never
      # reached Playwright — appended to `npm run test:e2e:viewer`, it landed
      # on the inner `npm run` as an npm option and was dropped — so the
      # screenshots have been compared on this runner all along, and passing.
      #
      # Which settles the question the flag was hedging: they do survive. The
      # build step and the run are separate so the arguments go where they
      # look like they go.
      - name: Build the CLI and the viewer
        run: npm run build

      - name: Sync, serve and drive the viewer
        run: npm run e2e --workspace @devcontext/e2e

      # test-results, not playwright-report: the reporters configured here are
      # `github` and `list`, neither of which writes an html report, so this
      # step has been uploading nothing. The diff images a screenshot failure
      # actually produces are in the output directory.
      - name: Upload the failure diffs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-diffs
          path: e2e/test-results
          retention-days: 7
