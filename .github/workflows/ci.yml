name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the minimum devcontext supports (node:sqlite), 24 is current.
        node: ['22', '24']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (oxfmt)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint

      # Before the type check: @devcontext/eve imports @devcontext/cli, whose
      # type declarations only exist once the CLI is built.
      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  # The site renders docs/, so a renamed page or a broken cross reference
  # breaks it — which is only visible once it is built.
  site:
    name: Site
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build:site

      - name: Check the rendered links
        run: npm run check:links --workspace @devcontext/site

      - name: Check both syntax themes are wired up
        run: npm run check:themes --workspace @devcontext/site

  # Syncs this repository from the real GitHub API. Kept separate so a GitHub
  # outage or a rate limit cannot make the offline checks look broken.
  e2e:
    name: End to end sync
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync issues and pull requests of this repository
        env:
          DEVCONTEXT_E2E_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVCONTEXT_E2E_REPO: ${{ github.repository }}
        run: npm run test:e2e

  # Syncs a fixture API, serves what it wrote, and drives the result in a real
  # browser. Offline and deterministic, so unlike the job above it can fail
  # only because something is actually broken.
  viewer:
    name: End to end viewer
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # --ignore-snapshots on purpose. The behavioural half of this suite is
      # environment independent and gates here; the screenshots are not, since
      # they depend on the exact Chromium build and the fonts installed, and a
      # baseline recorded on a developer's machine would fail on this runner
      # for reasons that have nothing to do with the change. They are a review
      # aid, refreshed with `npm run test:e2e:update`.
      - name: Sync, serve and drive the viewer
        run: npm run test:e2e:viewer -- --ignore-snapshots

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
